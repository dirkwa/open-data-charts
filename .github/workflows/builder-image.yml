name: Builder image

on:
  push:
    branches: [main]
    paths: ['builder/**', 'odc/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: builder/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/builder:main
            ghcr.io/${{ github.repository }}/builder:sha-${{ github.sha }}
