name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the builder image
        run: docker build -f builder/Dockerfile -t odc-builder .
      - name: Unit tests
        run: docker run --rm -v "$PWD:/src" -w /src --user "$(id -u)" odc-builder python3 -m pytest -q -p no:cacheprovider
