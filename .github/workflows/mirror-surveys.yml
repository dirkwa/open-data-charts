name: Mirror surveys

# Keeps every Shom and BSH (SVDB) survey and Litto3D package of the configured regions reduced to
# the global grid, as assets of the draft releases "mirror-0" to "mirror-f" (reachable
# by CI, not listed publicly; odc.mirror says why there are sixteen). The
# draft release "mirror" holds the index. Only surveys that are new, or whose source md5 changed, are
# downloaded; a run that stops halfway keeps the assets it uploaded.

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Shared with build-units.yml: a build must not read survey assets this run
# replaces.
concurrency:
  group: mirror-and-units
  cancel-in-progress: false
  queue: max

env:
  GH_TOKEN: ${{ github.token }}
  MIRROR_TAG: mirror

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the builder image
        run: docker build -f builder/Dockerfile -t odc-builder .
      - name: Make sure the draft releases exist
        run: |
          for tag in "$MIRROR_TAG" "$MIRROR_TAG"-{0..9} "$MIRROR_TAG"-{a..f}; do
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --draft --title "Survey mirror (internal, $tag)" \
                --notes 'Reduced surveys for the unit builds. Not a chart release.'
          done
      - name: List mirrored assets
        run: bash .github/scripts/mirror-assets.sh > assets.json
      - name: Plan
        id: plan
        run: |
          mkdir -p work && chmod 777 work
          docker run --rm -v "$PWD:/src" -w /src -e PYTHONPATH=/src -e GITHUB_OUTPUT=/src/github-output \
            odc-builder python3 -m odc.mirror plan regions assets.json work
          cat github-output >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: mirror-plan
          path: work

  reduce:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mirror-plan
          path: work
      # A Litto3D package is up to 9 GB, and one is reduced per CPU at once.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the builder image
        run: docker build -f builder/Dockerfile -t odc-builder .
      - name: Download and reduce
        run: |
          mkdir -p reduced && chmod 777 reduced
          docker run --rm -v "$PWD:/src" -w /src -e PYTHONPATH=/src \
            odc-builder python3 -m odc.mirror reduce "work/shards/${{ matrix.shard }}.json" reduced
      - name: Upload what was reduced
        if: always()
        run: |
          shopt -s nullglob
          files=(reduced/*.npz)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          docker run --rm -v "$PWD:/src" -w /src -e PYTHONPATH=/src \
            odc-builder python3 -m odc.mirror releases "${files[@]}" > releases.txt
          declare -A batch
          while read -r tag path; do batch[$tag]+=" $path"; done < releases.txt
          for tag in "${!batch[@]}"; do
            # shellcheck disable=SC2086 # asset paths hold no spaces
            gh release upload "$tag" ${batch[$tag]} --clobber
          done

  index:
    needs: [plan, reduce]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mirror-plan
          path: work
      - name: Build the builder image
        run: docker build -f builder/Dockerfile -t odc-builder .
      - name: Write the mirror index
        id: index
        run: |
          bash .github/scripts/mirror-assets.sh > assets.json
          # Only a missing index means a first run; a failed download must stop
          # the run, or the guard against a short discovery has nothing to compare.
          old=-
          if jq -e 'any(.[]; .name == "mirror-index.json")' assets.json >/dev/null; then
            gh release download "$MIRROR_TAG" -p mirror-index.json -D old
            old=old/mirror-index.json
          fi
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD:/src" -w /src -e PYTHONPATH=/src -e GITHUB_OUTPUT=/src/github-output \
            odc-builder python3 -m odc.mirror index work assets.json "$old" out
          cat github-output >> "$GITHUB_OUTPUT"
      - name: Publish the index
        if: steps.index.outputs.changed == 'true'
        run: gh release upload "$MIRROR_TAG" out/mirror-index.json out/footprints.geojson --clobber
      - name: Remove superseded surveys
        run: |
          jq -r '.[] | "\(.release) \(.name)"' out/stale-assets.json | while read -r tag name; do
            gh release delete-asset "$tag" "$name" --yes
          done
