name: Seamark coverage (one-off)
on:
  push:
    branches: [chore/seamark-coverage]
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Extract seamark nodes
        run: |
          set -e
          UA='open-data-charts/0.1 (+https://github.com/dirkwa/open-data-charts)'
          mkdir -p sm
          for p in europe/spain europe/italy europe/malta europe/croatia europe/slovenia europe/montenegro \
            europe/albania europe/greece europe/cyprus europe/turkey europe/norway europe/denmark \
            europe/ireland-and-northern-ireland europe/france/bretagne europe/france/provence-alpes-cote-d-azur \
            africa/tunisia central-america south-america/colombia north-america/mexico \
            australia-oceania/fiji australia-oceania/tonga australia-oceania/vanuatu \
            australia-oceania/new-zealand australia-oceania/australia; do
            n=$(echo "$p" | tr / _)
            curl -fsSL -A "$UA" -o in.pbf "https://download.geofabrik.de/$p-latest.osm.pbf" || { echo "::warning::no $p"; continue; }
            osmium tags-filter -O -o f.pbf in.pbf n/seamark:type
            osmium export -O -f geojsonseq -o "sm/$n.geojsonseq" f.pbf --add-unique-id=type_id
            echo "$p $(wc -l < sm/$n.geojsonseq)"
            rm -f in.pbf f.pbf
          done
      - run: python3 tools/seamark_counts.py sm/*.geojsonseq | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: seamark-counts
          path: counts.json
